dataset_configs:
  desc: Dataset Configurations (FineWeb-Edu pre-tokenized GPT-2 shards, see dataset/prepare_data.py)
  value:
    dataset_path: "./dataset/finewebedu" # LOCAL
    # dataset_path: "/content/finewebedu" # GOOGLE COLAB
    micro_batch_size: 32 # B: sequences per forward pass
    sequence_length: 256 # T: tokens per sequence, must equal block_size

training_hyperparameters:
  desc: Training Hyperparameters
  value:
    total_batch_size: 262144 # 2**18 tokens = B * T * 32 grad accum steps
    max_steps: 7629 # 1 epoch of 20 shards: 2B tokens / 262144 tokens per step
    warmup_steps: 300
    max_lr: 0.001
    min_lr: 0.0001
    weight_decay: 0.1
    adam_betas: [0.9, 0.95]
    adam_eps: 0.00000001
    precision: "16-mixed"
    compile: True
    eval_interval: 100 # optimizer steps (~26M tokens)
    val_loss_steps: 20 # micro batches (~164K tokens)

model_architecture_hyperparameters:
  desc: Model Architecture Hyperparameters (~30M params, tutorial 1 dimensions)
  value:
    block_size: 256 # max sequence length
    vocab_size: 50304
    num_layers: 6
    num_heads: 6
    embed_dim: 384

experiment_details:
  desc: Experiment Details
  value:
    model_dir: "./trained_models/" # LOCAL
    # model_dir: "/content/drive/MyDrive/Programming/trained_models/" # GOOGLE COLAB (persists across sessions)
    experiment_name: "gpt2_small_finewebedu_2B"
    use_wandb: True
    seed: 1337

wandb_config:
  desc: Weights and Biases Configuration
  value:
    project: "GPT2_FromScratch"
    entity: "deveshshah"
    mode: "online"
    config: {}
