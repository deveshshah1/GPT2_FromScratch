dataset_configs:
  desc: Text Dataset Configurations (Tiny Shakespeare, GPT-2 tokenizer)
  value:
    dataset_path: "./dataset/input.txt" # LOCAL
    # dataset_path: "/content/drive/MyDrive/Programming/dataset/input.txt" # GOOGLE COLAB
    train_split: 0.9
    micro_batch_size: 64 # B: sequences per forward pass
    sequence_length: 1024 # T: tokens per sequence

training_hyperparameters:
  desc: Training Hyperparameters
  value:
    total_batch_size: 524288
    max_steps: 19073
    warmup_steps: 715
    max_lr: 0.0006
    min_lr: 0.00006
    weight_decay: 0.1
    adam_betas: [0.9, 0.95]
    adam_eps: 0.00000001
    precision: "bf16-mixed"
    eval_interval: 250
    val_loss_steps: 20

model_architecture_hyperparameters:
  desc: Model Architecture Hyperparameters (GPT-2 124M)
  value:
    block_size: 1024 # max sequence length
    vocab_size: 50304
    n_layer: 12
    n_head: 12
    n_embd: 768

experiment_details:
  desc: Experiment Details
  value:
    model_dir: "./trained_models/"
    experiment_name: "gpt2_124M_fineweb10B"
    use_wandb: True
    seed: 1337

wandb_config:
  desc: Weights and Biases Configuration
  value:
    project: "GPT2_FromScratch"
    entity: "deveshshah"
    mode: "online"
    config: {}
